services:
  - type: web
    name: regreen-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: PROJECT_ID
        sync: false
      - key: SERVICE_ROLE_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: PAYOS_CLIENT_ID
        sync: false
      - key: PAYOS_API_KEY
        sync: false
      - key: PAYOS_CHECKSUM_KEY
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: ""
      - key: PAYOS_RETURN_URL
        value: ""
      - key: PAYOS_CANCEL_URL
        value: ""
    healthCheckPath: /actuator/health
    autoDeploy: true
